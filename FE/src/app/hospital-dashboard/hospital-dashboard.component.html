<div class="page">
  <!-- Top Header -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__title">MCX Bolnica</div>
        <div class="brand__subtitle">BOLNIČKI portal</div>
      </div>

      <div class="topbar__actions">
        <span class="muted">KBC Osijek</span>
        <button type="button" (click)="resetDemo()" class="btn">Resetiraj demo</button>
        <button type="button" class="btn btn--primary" title="(samo demo)">Odjava</button>
      </div>
    </div>
  </header>

  <ng-container *ngIf="vm$ | async as vm">
    <app-cases-overview *ngIf="!vm.selected" [cases]="vm.cases" (select)="selectCase($event)"></app-cases-overview>

      <app-case-detail *ngIf="vm.selected as selectedCase"
        [cases]="vm.cases"
        [selectedCase]="selectedCase"
        [messageText]="messageText"
        (messageTextChange)="messageText = $event"
        (select)="selectCase($event)"
        (deselect)="deselect()"
        (acknowledge)="acknowledge($event)"
        (send)="send($event)"
      ></app-case-detail>
</ng-container>
</div>
