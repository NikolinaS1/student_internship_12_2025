<div class="page">
  <!-- Top Header -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__title">MCX Hospital</div>
        <div class="brand__subtitle">Hospital portal</div>
      </div>

      <div class="topbar__actions">
        <span class="muted">KBC Osijek</span>
        <button type="button" class="btn btn--primary" title="(samo demo)">Logout</button>
      </div>
    </div>
  </header>

  <ng-container *ngIf="vm$ | async as vm">
    <!-- Pregled svih slučajeva -->
    <app-cases-overview 
      *ngIf="!vm.selected" 
      [cases]="vm.cases" 
      (select)="selectCase($event)"
    ></app-cases-overview>

    <!-- Detalji odabranog slučaja -->
    <app-case-detail 
      *ngIf="vm.selected" 
      [selectedCase]="vm.selected"
      [allCases]="vm.cases"
      [messageText]="messageText"
      (messageTextChange)="messageText = $event"
      (deselect)="deselect()"
      (acknowledge)="acknowledge($event)"
      (send)="send($event)"
      (caseSelect)="selectCase($event)"
    ></app-case-detail>
  </ng-container>
</div>
