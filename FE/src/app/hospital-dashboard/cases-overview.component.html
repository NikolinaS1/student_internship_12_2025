<main class="overview">
  <!-- Left: Cases -->
  <section class="overview__left">
    <div class="heading_flex">
      <div class="overview__head">
        <div>
          <!-- CHANGED: English translation -->
          <div class="overview__title">Active Cases</div>
          <div class="overview__subtitle">Click on a case to open details and chat.</div>
        </div>
      </div>
    </div>

    <!-- Loading & Error States -->
    <div *ngIf="loading$ | async" class="loading-state">
      <div class="spinner"></div>
      <!-- CHANGED: English translation -->
      <p>Loading cases...</p>
    </div>

    <div *ngIf="error$ | async as error" class="error-state">
      <p>⚠ {{ error }}</p>
    </div>

    <!-- Cases List -->
    <div class="overview__cases" *ngIf="!(loading$ | async)">
      <button
        *ngFor="let c of cases"
        type="button"
        (click)="selectCaseHandler(c)"
        class="case-card"
        [ngClass]="[
          !isActive(c) ? 'case-card--disabled' : '',
          c.priority === 'HIGH' ? 'case-card--high' :
          c.priority === 'MEDIUM' ? 'case-card--medium' : 'case-card--low'
        ]"
      >
        <!-- CHANGED: Improved card structure -->
        <div class="case-card__top">
          <div>
            <div class="case-card__name">{{ c.patientName }}</div>
            <div class="case-card__meta">{{ 2026 - c.birthYear }} years old • #{{ c.id }}</div>
          </div>
          <span class="priority-dot" [ngClass]="[
            c.priority === 'HIGH' ? 'dot-high' :
            c.priority === 'MEDIUM' ? 'dot-medium' : 'dot-low'
          ]"></span>
        </div>

        <!-- CHANGED: Better grid layout for pills -->
        <div class="case-card__grid">
          <div class="case-mini">
            <div class="case-mini__label">Priority</div>
            <div class="case-mini__value case-mini__value--strong">{{ c.priority }}</div>
          </div>
          <div class="case-mini">
            <div class="case-mini__label">Status</div>
            <div class="case-mini__value">
              <span
                class="chip"
                [ngClass]="[
                  c.acknowledged ? 'chip--ack' :
                  c.isActive ? 'chip--sent' : 'chip--closed'
                ]"
              >
                {{ c.acknowledged ? 'Acknowledged' : c.isActive ? 'Sent' : 'Closed' }}
              </span>
            </div>
          </div>

          <!-- CHANGED: ETA in grid -->
          <div class="case-eta case-eta--compact">
            <div>ETA</div>
            <div>{{ c.etaMinutes || '-' }} min</div>
          </div>

          <!-- CHANGED: Summary spans full width -->
          <div class="case-summary">
            {{ c.summary }}
          </div>
        </div>

        <!-- CHANGED: Acknowledge button with updated styling -->
        <div class="case-actions">
          <button 
            *ngIf="c.isActive && !c.acknowledged"
            type="button"
            (click)="acknowledgeCaseHandler(c.id, $event)"
            class="btn-acknowledge"
          >
            ✓ Acknowledge case
          </button>
        </div>
      </button>

      <div *ngIf="cases.length === 0" class="no-cases">
        <p>No active cases</p>
      </div>
    </div>
  </section>

  <!-- Right: Map -->
  <aside class="overview__right">
    <div class="card map-card">
      <div class="card__header">
        <div class="card__title">Live Map</div>
        <div class="muted card__subtitle">Osijek, Croatia</div>
        <div class="map-info" *ngIf="selectedCaseEta">
          <div class="eta-display">
            <span class="eta-label">ETA:</span>
            <span class="eta-value">{{ selectedCaseEta.minutes }} min</span>
            <span class="distance-value">({{ selectedCaseEta.km }} km)</span>
          </div>
        </div>
      </div>

      <div class="map-card__body">
        <div id="map" class="leaflet-map"></div>
      </div>
    </div>
  </aside>
</main>
