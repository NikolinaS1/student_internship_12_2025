<div class="page">
  <!-- Top Header -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__title">MCX Hospital</div>
        <div class="brand__subtitle">Hospital portal</div>
      </div>

      <div class="topbar__actions">
        <span class="muted">KBC Osijek</span>
        <button type="button" class="btn btn--primary" (click)="authService.logout()">Logout</button>
      </div>
    </div>
  </header>

  <!-- All cases overview -->
  @if (!store.selectedCase()) {
    <app-cases-overview 
      [cases]="store.cases()" 
      (select)="selectCase($event)"
    ></app-cases-overview>
  }

  <!-- Case details -->
  @if (store.selectedCase()) {
    <app-case-detail 
      [selectedCase]="store.selectedCase()!"
      [allCases]="store.cases()"
      [messageText]="messageText"
      (messageTextChange)="messageText = $event"
      (deselect)="deselect()"
      (acknowledge)="acknowledge($event)"
      (caseSelect)="selectCase($event)"
    ></app-case-detail>
  }
  <div class="notifications-container">
    <div class="notification-popup" *ngFor="let msg of notifications">
      <strong>{{msg.senderName}}</strong>
      <span>{{msg.message}}</span>
    </div>
  </div>

</div>
